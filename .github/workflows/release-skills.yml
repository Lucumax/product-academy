name: Build and Publish Skill Pack Release

on:
  push:
    tags:
      - "skills-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate skill pack
        run: |
          python -m pip install pyyaml -q
          python scripts/validate_skills.py

      - name: Package skill ZIPs
        run: python scripts/package_skills.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Skill Pack ${{ github.ref_name }}"
          body: |
            Evidence-backed product decision skills from the Product Academy.

            - **product-academy-skills-all.zip** — all skills
            - **product-academy-skills-core.zip** — the 10 P0 skills
            - **INSTALL.md** — per-platform install instructions

            See https://github.com/Lucumax/product-academy/tree/main/skills for the source of truth.
          files: |
            dist/skills/product-academy-skills-all.zip
            dist/skills/product-academy-skills-core.zip
            dist/skills/INSTALL.md
