name: Build and Publish Skill Pack Release

on:
  push:
    tags:
      - "skills-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate skill pack
        run: |
          python -m pip install pyyaml -q
          python scripts/validate_skills.py

      - name: Package skill ZIPs
        run: python scripts/package_skills.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Skill Pack ${{ github.ref_name }}"
          body: |
            Evidence-backed product decision skills from the Product Academy.

            **Supersedes skills-v0.1.0** (the previous ten-skill pack). This release ships
            the hardened portfolio: 14 active skills (5 new high-frequency PM skills +
            the evidence/judgment layer), the shared contract, and 4 end-to-end workflows.

            - **product-academy-skills-all.zip** — all 14 active skills + shared contract + workflows
            - **product-academy-skills-core.zip** — the 8 highest-frequency PM skills (starter set)
            - **INSTALL.md** — per-platform install instructions

            Source of truth: https://github.com/Lucumax/product-academy/tree/${{ github.ref_name }}/skills
            (note: `main`/skills is not yet updated until the hardening branch is merged).
          files: |
            dist/skills/product-academy-skills-all.zip
            dist/skills/product-academy-skills-core.zip
            dist/skills/INSTALL.md
